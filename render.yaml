services:
  - type: web
    name: payagent-sentinel-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SENTINEL_POLICY_HMAC_SECRET
        generateValue: true
      - key: SENTINEL_MAX_SINGLE_TRANSACTION
        value: "1000.00"
      - key: SENTINEL_MAX_DAILY_VELOCITY
        value: "5000.00"
      - key: SENTINEL_EMERGENCY_KILLSWITCH
        value: "false"
